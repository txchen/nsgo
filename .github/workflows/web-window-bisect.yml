name: Web window bisect

on:
  push:
    branches:
      - agiox/web-window-bisect

permissions:
  contents: read

jobs:
  probe:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sha: ["9d839d78e95099c814768526b9bb3edee7f387cc", "528279400a005496f99b1e3a2cb692290972d002", "a15fc2df0fcb114fd157aae49db1942ff29fd9d6", "d2fc8f1347af77686b5e0b7f67f37885fd187f84", "5af81b80685372b27508cecf309011220e0f870a", "4c4c050dde0f2f90a9fb50fc386473be69a080f5", "82eb19d1a4eee381fc1bc635142e138e1d5a5112", "b74d7aeda7fbe55f0a6c3c9f5dd524c3877b3d57"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y at-spi2-core libgtk-4-dev libgtk-4-media-gstreamer libwebkitgtk-6.0-4 libsoup-3.0-0 xvfb dbus apparmor
      - name: Allow WebKit's sandbox on the runner
        run: |
          # Ubuntu restricts unprivileged user namespaces. Grant bubblewrap that permission so WebKit can keep its sandbox enabled.
          sudo tee /etc/apparmor.d/nsgo-ci-bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile nsgo-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace /etc/apparmor.d/nsgo-ci-bwrap
          bwrap --unshare-user --unshare-net --ro-bind / / /usr/bin/true
      - name: Test web windows
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: xvfb-run -a go tool nsgo test -target linux -run '^TestWebWindow' ./internal/testhost/testdata/websource
