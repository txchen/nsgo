name: Web window bisect

on:
  push:
    branches:
      - agiox/web-window-bisect

permissions:
  contents: read

jobs:
  probe:
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sha: ["c5117d1e61e0bba35dce2c139a4712a10cf5ef28", "37cddb81a79ec79ab9bfad115273d43fc77106d6", "dca40eba6b6c9d8ce60f059db63b5650d4482eae", "12f78ecca6937391f6a8ba981ce7814bc2ca87a7", "a28c482c1f4373aefd94d6b460fa2fcf5c8ffda9", "c515b1b98fae29541288d8e4cae59eaa22748d54", "3eb47719b9108788dfa38b98747ccf24487c3c44"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor at-spi2-core libgtk-4-dev libgtk-4-media-gstreamer libwebkitgtk-6.0-4 libsoup-3.0-0 xvfb openbox pulseaudio gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-pulseaudio gstreamer1.0-libav desktop-file-utils shared-mime-info libglib2.0-bin libdbusmenu-glib4 avahi-daemon dbus openbox gnome-sushi
      - name: Allow WebKit's sandbox on the runner
        run: |
          # Ubuntu restricts unprivileged user namespaces. Grant bubblewrap that permission so WebKit can keep its sandbox enabled.
          sudo tee /etc/apparmor.d/nsgo-ci-bwrap > /dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile nsgo-ci-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
          sudo apparmor_parser --replace /etc/apparmor.d/nsgo-ci-bwrap
          bwrap --unshare-user --unshare-net --ro-bind / / /usr/bin/true
      - name: Test web windows
        env:
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
        run: xvfb-run -a go tool nsgo test -target linux ./internal/testhost/testdata/websource
